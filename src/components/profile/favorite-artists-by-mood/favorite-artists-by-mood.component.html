<p-card class="favorite-card">
  <div class="favorite-header">
    <h3>ARTISTI PER OGNI MOOD</h3>
  </div>

  <div class="favorite-content">
    <!-- Stato di caricamento -->
    <div *ngIf="loading" class="loading-message">
      <p-progressSpinner></p-progressSpinner>
      <p>Caricamento...</p>
    </div>

    <!-- Stato normale: mostra dati se disponibili -->
    <div *ngIf="!loading">
      <div
        *ngIf="
          favoriteArtistsByMood &&
            Object.keys(favoriteArtistsByMood).length > 0;
          else noData
        ">
        <ul class="mood-list">
          <li *ngFor="let mood of Object.keys(favoriteArtistsByMood)">
            <strong class="mood-label"
              >{{ emotionsService.getMoodLabel(mood) }}:</strong
            >
            <span
              *ngFor="let artist of favoriteArtistsByMood[mood]"
              class="mood-badge">
              {{ artist }}
            </span>
          </li>
        </ul>
      </div>

      <!-- Messaggio se non ci sono dati -->
      <ng-template #noData>
        <p class="no-data">
          <i class="pi pi-info-circle"></i> Nessun dato disponibile sugli
          artisti preferiti per mood.
        </p>
      </ng-template>
    </div>
  </div>
</p-card>
